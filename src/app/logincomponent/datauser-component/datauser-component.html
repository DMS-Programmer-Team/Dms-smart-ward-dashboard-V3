<div class="continer bg-[#36858A] w-full h-screen flex py-10 sm:py-20 px-4 sm:px-10 lg:px-20">
    <div class="w-full h-full bg-white rounded-box flex flex-col shadow-xl overflow-hidden ">

        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 w-full flex-wrap">

            <div class="flex flex-row items-center gap-4">
                <img src="./LOGO DMS Black.png" alt="" class="w-20 h-20 sm:w-28 sm:h-28">
                <h1 class="text-2xl sm:text-4xl font-bold text-[#2292AD] text-shadow-lg">
                    DMS SMART DASHBOARD WARDS
                </h1>
            </div>

        </div>

        <div class="flex justify-start items-center px-6  w-full flex-wrap">

            <div class="flex flex-row items-center">
                <button class="btn border border-[#36858A] bg-[#36858A] text-white hover:bg-white hover:text-[#36858A]"
                    (click)="clicktoregister()">
                    <i class="fa-solid fa-less-than"></i>
                    ย้อนกลับ
                </button>
            </div>

        </div>

        <!-- Register Form -->
        <div class="flex flex-col justify-center items-center px-6 w-full h-screen mb-2">
            <div class="card w-full max-w-lg   dark:border-gray-700 shadow-lg rounded-2xl px-10 py-2 ">

                <h2 class="text-2xl font-bold text-center text-[#36858A] ">
                    สมัครสมาชิก
                </h2>

                <form class="space-y-4 w-full ">
                    <!-- คำนำหน้า -->
                    <div data-theme="light">
                        <label class="label">
                            <span class="label-text font-semibold text-[#2292AD]">คำนำหน้า (Prefix)</span>
                        </label>
                        <input type="text" [(ngModel)]="pname" name="pname" placeholder="กรอกชื่อของคุณ"
                            class="input input-bordered w-full" />
                    </div>

                    <!-- ชื่อ -->
                    <div data-theme="light">
                        <label class="label">
                            <span class="label-text font-semibold text-[#2292AD]">ชื่อ (Name)</span>
                        </label>
                        <input type="text" [(ngModel)]="fname" name="fname" placeholder="กรอกชื่อของคุณ" (ngModelChange)="loadUserData()"
                            class="input input-bordered w-full" />
                    </div>

                    <!-- นามสกุล -->
                    <div data-theme="light">
                        <label class="label">
                            <span class="label-text font-semibold text-[#2292AD]">นามสกุล (Lastname)</span>
                        </label>
                        <input type="text" [(ngModel)]="lname" name="lname" placeholder="กรอกนามสกุลของคุณ" (ngModelChange)="loadUserData()"
                            class="input input-bordered w-full" />
                    </div>

                    <!-- ตำแหน่ง -->
                    <div data-theme="light">
                        <label class="label">
                            <span class="label-text font-semibold text-[#2292AD]">ตำแหน่ง (Position)</span>
                        </label>
                        <input type="text" [(ngModel)]="departmentpostion" name="departmentpostion"
                            placeholder="กรอกตำแหน่งของคุณ" class="input input-bordered w-full" />
                    </div>

                    <!-- Ward -->
                    <div data-theme="light">
                        <label class="label">
                            <span class="label-text font-semibold text-[#2292AD]">วอร์ด (Ward)</span>
                        </label>
                        <select [(ngModel)]="wardcode" name="wardcode" class="select select-bordered w-full" placeholder="เลือกวอร์ดของคุณ">
                            <option disabled selected>เลือกวอร์ดของคุณ</option>
                            <option *ngFor="let ward of wards" [value]="ward.wardcode">
                                {{ ward.wardname }}
                            </option>
                        </select>
                    </div>

                    <!-- Button -->
                    <div class="pt-4">
                        <button (click)="submitRegister()"
                            class="btn btn-primary w-full text-white bg-[#2292AD] hover:bg-[#1d7e97] transition duration-300">
                            สมัครสมาชิก
                        </button>
                    </div>
                </form>

                <!-- ลิงก์กลับหน้า Login -->
                <div class="text-center mt-4">
                    <p class="text-sm text-gray-500">
                        มีบัญชีอยู่แล้ว?
                        <a href="/genqrcode" class="text-[#2292AD] font-semibold hover:underline">
                            เข้าสู่ระบบ
                        </a>
                    </p>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="mt-auto">
            <app-footercomponent></app-footercomponent>
        </div>

    </div>
</div>
