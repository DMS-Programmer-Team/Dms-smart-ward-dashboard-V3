<div class="continer bg-[#36858A] w-full h-screen flex py-10 sm:py-20 px-4 sm:px-10 lg:px-20">
    <div class="w-full h-full bg-white rounded-box flex flex-col shadow-xl overflow-hidden ">

        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 w-full flex-wrap">

            <div class="flex flex-row items-center gap-4">
                <img src="./LOGO DMS Black.png" alt="" class="w-20 h-20 sm:w-28 sm:h-28">
                <h1 class="text-2xl sm:text-4xl font-bold text-[#2292AD] text-shadow-lg">
                    DMS SMART DASHBOARD WARDS
                </h1>
            </div>

        </div>

        <div class="flex justify-start items-center px-6  w-full flex-wrap">

            <div class="flex flex-row items-center">
                <button class="btn border border-[#36858A] bg-[#36858A] text-white hover:bg-white hover:text-[#36858A]"
                    (click)="clicktopageadmin()">
                    <i class="fa-solid fa-less-than"></i>
                    ย้อนกลับ
                </button>
            </div>

        </div>


        <div class="flex justify-center items-start w-full px-6 py-10">

            <!-- 👇 กำหนด max width + จัดกลาง -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 w-full max-w-4xl">

                <!-- ค้นหาผู้ใช้งาน -->
                <div class="card w-full shadow-lg rounded-2xl px-10 py-6">
                    <h2 class="text-2xl font-bold text-center text-[#36858A] mb-2">ค้นหาผู้ใช้งานระบบ</h2>

                    <form class="space-y-4 w-full">
                        <div data-theme="light">
                            <label class="label">
                                <span class="label-text font-semibold text-[#2292AD]">ชื่อ (Name)</span>
                            </label>
                            <input type="text" [(ngModel)]="fname" name="fname" class="input input-bordered w-full" placeholder="กรุณากรอกชื่อ" />
                        </div>

                        <div data-theme="light">
                            <label class="label">
                                <span class="label-text font-semibold text-[#2292AD]">นามสกุล (Lastname)</span>
                            </label>
                            <input type="text" [(ngModel)]="lname" name="lname" class="input input-bordered w-full" placeholder="กรุณากรอกนามสกุล" />
                        </div>

                        <button type="button" (click)="searchuser()"
                            class="btn btn-primary w-full text-white bg-[#2292AD] hover:bg-[#1d7e97]">
                            ค้นหา
                        </button>
                    </form>
                </div>

                <!-- เพิ่มสิทธิ์ -->
                <div class="card w-full dark:border-gray-700 shadow-lg rounded-2xl px-10 py-6">
                    <form class="space-y-4 w-full">
                        <h2 class="text-2xl font-bold text-center text-[#36858A] mb-2">เพิ่มวอร์ดผู้ใช้งาน</h2>

                        <div data-theme="light">
                            <label class="label">
                                <span class="label-text font-semibold text-[#2292AD]">ชื่อผู้ใช้ (Username)</span>
                            </label>
                            <input type="text" [(ngModel)]="username" name="username"
                                class="input input-bordered w-full" readonly />
                        </div>

                        <div data-theme="light">
                            <label class="label">
                                <span class="label-text font-semibold text-[#2292AD]">วอร์ด (Ward)</span>
                            </label>
                            <select [(ngModel)]="wardcode" name="wardcode" class="select select-bordered w-full">
                                <option disabled selected>เลือกวอร์ดของคุณ</option>
                                <option *ngFor="let ward of wards" [value]="ward.wardcode">
                                    {{ ward.wardname }}
                                </option>
                            </select>
                        </div>

                        <div class="pt-4">
                            <button (click)="submitaddward()"
                                class="btn btn-primary w-full text-white bg-[#2292AD] hover:bg-[#1d7e97]">
                                บันทึก
                            </button>
                        </div>
                    </form>
                </div>

            </div>

        </div>


        <!-- Footer -->
        <div class="mt-auto">
            <app-footercomponent></app-footercomponent>
        </div>

    </div>
</div>
