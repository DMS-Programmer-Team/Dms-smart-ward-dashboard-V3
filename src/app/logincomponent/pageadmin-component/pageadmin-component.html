<div class="continer bg-[#36858A] w-full h-screen flex py-20 px-20 sm:px-10 lg:px-20">
    <div class="w-full h-full bg-[#FFFFFF] rounded-box flex flex-col ">

        <!-- Header -->
        <div class="flex justify-between items-center px-6 py-4 w-full flex-wrap">

            <!-- ซ้าย -->
            <div class="flex flex-row items-center gap-4">
                <img src="./LOGO DMS Black.png" alt="" class="w-20 h-20 sm:w-28 sm:h-28">
                <h1 class="text-2xl sm:text-4xl font-bold text-[#2292AD] text-shadow-lg">
                    DMS SMART DASHBOARD WARDS
                </h1>
            </div>

            <!-- ขวา -->
            <div class="flex flex-low gap-10">
                <button
                    class="btn border border-[#D30000] bg-[#D30000] text-white hover:bg-white hover:text-[#D30000] mt-2"
                    (click)="logout()">
                    ออกจากระบบ <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

        </div>

        <div class="flex text-center justify-center ">
            <span class="text-2xl font-bold text-shadow-lg text-[#2292AD]">
                หน้าจัดการผู้ใช้งานระบบ
            </span>
        </div>

        <div class="grid grid-cols-4 gap-10 justify-center mt-auto px-10  mx-auto">


            <div class="flex flex-col justify-center items-center text-2xl font-bold border-2 border-[#0C2B4E] bg-[#0C2B4E] text-white hover:border-[#0C2B4E] hover:bg-white hover:text-[#0C2B4E]
                    rounded-lg shadow-lg h-64 w-96 py-4 px-8 cursor-pointer" (click)="clciktoadduser()">
                ADD USER
                <i class="fa-solid fa-user-plus text-8xl mt-10"></i>

            </div>

            <div class="flex flex-col justify-center items-center text-2xl font-bold  border-2 border-[#4A70A9] bg-[#4A70A9] text-white hover:border-[#4A70A9] 
                 hover:bg-white hover:text-[#4A70A9] h-64 w-96 rounded-lg shadow-lg py-4 px-8 cursor-pointer"
                (click)="clciktoaddwarduser()">
                ADD WARDS USER
                <i class="fa-solid fa-address-card text-8xl mt-10"></i>
            </div>

            <div class="flex flex-col justify-center items-center text-2xl font-bold  border-2 border-[#1581BF] bg-[#1581BF] text-white hover:border-[#1581BF] 
                 hover:bg-white hover:text-[#1581BF] h-64 w-96 rounded-lg shadow-lg py-4 px-8 cursor-pointer"
                (click)="clciktoedituser()">
                EDIT USER
                <i class="fa-solid fa-user-pen text-8xl mt-10"></i>
            </div>

            <div class="flex flex-col justify-center items-center text-2xl font-bold  border-2 border-[#5A9CB5] bg-[#5A9CB5] text-white hover:border-[#5A9CB5] 
                 hover:bg-white hover:text-[#1581BF] h-64 w-96 rounded-lg shadow-lg py-4 px-8 cursor-pointer"
                (click)="clciktoresetaccount()">
                RESET ACCOUNT
                <i class="fa-solid fa-user-minus text-8xl mt-10"></i>
            </div>
        </div>


        <div class="mt-auto">
            <app-footercomponent></app-footercomponent>
        </div>

    </div>
</div>
