<div class="continer bg-[#36858A] w-full h-screen flex py-10 sm:py-20 px-4 sm:px-10 lg:px-20">
  <div class="w-full h-full bg-white rounded-box flex flex-col shadow-xl overflow-hidden ">

    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-4 w-full flex-wrap">

      <div class="flex flex-row items-center gap-4">
        <img src="./LOGO DMS Black.png" alt="" class="w-20 h-20 sm:w-28 sm:h-28">
        <h1 class="text-2xl sm:text-4xl font-bold text-[#2292AD] text-shadow-lg">
          DMS SMART DASHBOARD WARDS
        </h1>
      </div>
      
    </div>

    <div class="flex justify-start items-center px-6  w-full flex-wrap">
     
      <div class="flex flex-row items-center">
        <button class="btn border border-[#36858A] bg-[#36858A] text-white hover:bg-white hover:text-[#36858A]"
          (click)="clicktologin()">
          <i class="fa-solid fa-less-than"></i>
          ย้อนกลับ
        </button>
      </div>

    </div>
    <!-- Register Form -->
    <div class="flex flex-col justify-center items-center px-6 w-full h-screen">
      <div class="card w-full max-w-lg   dark:border-gray-700 shadow-lg rounded-2xl px-10 py-2 ">

        <h2 class="text-2xl font-bold text-center text-[#36858A] ">
          สมัครสมาชิก
        </h2>

        <form class="space-y-4 w-full ">

          <!-- Username -->
          <div data-theme="light">
            <label class="label">
              <span class="label-text font-semibold text-[#2292AD]">ชื่อผู้ใช้ (Username)</span>
            </label>
            <input type="text" [(ngModel)]="username" name="username" placeholder="กรอกชื่อผู้ใช้" class="input input-bordered w-full" />
          </div>

          <!-- Password -->
          <div data-theme="light">
            <label class="label">
              <span class="label-text font-semibold text-[#2292AD]">รหัสผ่าน (Password)</span>
            </label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="กรอกรหัสผ่าน" class="input input-bordered w-full" />
          </div>


          <!--Confirm Password -->
          <div data-theme="light">
            <label class="label">
              <span class="label-text font-semibold text-[#2292AD]">ยืนยันรหัสผ่าน (Confirm Password)</span>
            </label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="กรอกรหัสผ่าน" class="input input-bordered w-full" />
          </div>


          <!-- Button -->
          <div class="pt-4 mb-4" (click)="clicktoinformaintion()" >
            <button class="btn btn-primary w-full text-white bg-[#2292AD] hover:bg-[#1d7e97] transition duration-300">
              ต่อไป
            </button>
          </div>
        </form>

      </div>
    </div>


    <!-- Footer -->
    <div class="mt-auto">
      <app-footercomponent></app-footercomponent>
    </div>

  </div>
</div>
