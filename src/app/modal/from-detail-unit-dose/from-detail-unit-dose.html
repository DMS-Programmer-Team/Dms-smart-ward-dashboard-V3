<dialog #modalUnitDose class="modal" id="my_modal_3" >
  <div class="modal-box w-full max-w-5xl bg-white ">

    <button type="button" (click)="close()"
      class="btn btn-sm btn-circle bg-white border-gray-400 text-red-400 absolute right-2 top-2 hover:bg-red-500 hover:text-white hover:border-red-500">
      ✕
    </button>

    <h3 class="text-xl  items-center flex justify-center text-black">รายการยา</h3>
    <div class="border-b border-gray-400 mt-4"></div>
    <div  class="flex flex-col mt-4">
      <div  *ngIf="selectedOrder" class="flex flex-row  gap-10 text-center ">
        <span class=" text-black">ชื่อ-นามสกุล : {{ selectedOrder.patient_name }}</span>
        <span class=" text-black">HN : {{ selectedOrder.hn }}</span>
        <span class=" text-black">วอร์ด : {{ selectedOrder.wardname }}</span>
      </div>
      <div class="border-b border-gray-400 mt-4"></div>

    </div>

    <div class="grid grid-cols-3 gap-4 mt-2">
      <!-- ข้อมูลยาและรูปภาพ -->
      <div class="row-span-6 rounded-2xl shadow-lg p-4">

        <div class="flex flex-col">
          <div class="flex justify-center items-center border-2 border-gray-100 rounded-2xl p-2">
            <img [src]="selectedDrug?.drug_image_base64 || './drugs.gif'" alt="">
          </div>
        </div>

        <div class="flex flex-col mt-4 gap-4" *ngIf="selectedDrug as data">

          <span class="text-black text-ml">ชื่อยา : {{ data.genericname }}</span>
          <span class="text-black text-ml">จำนวน : {{ data.qty }}</span>
          <span class="text-black text-ml">หน่วย : {{ data.units }}</span>
          <span class="text-black text-ml">สถานะ : {{ data.state_description }}</span>

        </div>

      </div>


      <!-- ข้อมูลยังไม่ได้เช็ครับยา -->
      <div class="flex flex-col items-start justify-start">
        <span class="text-black text-ml"><i class="fa-solid fa-magnifying-glass"></i>ค้นหา</span>
        <input #searchInput type="search" placeholder="กรุณากรอกชื่อยา" class="input bg-white text-black border border-gray-100" 
        [(ngModel)]="searchText" (keyup)="searchdrug()" />
      </div>

      <div class="col-span-2 row-span-2 text-black">
        <!-- <span class="text-[#D30000] text-ml font-bold"><i class="fa-regular fa-circle-xmark"></i> Unchecked</span> -->
        <div class="w-full max-w-5xl mx-auto ">
          <table class="table w-full border border-gray-300 rounded-lg overflow-hidden shadow-lg">
            <thead class="bg-[#1581BF] text-white">
              <tr class="text-center">
                <th class="text-center w-12">#</th>
                <th>ชื่อยา</th>
                <!-- <th class="text-center w-12"></th> -->
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of filteredOrderDetails; let i = index"  class="text-center text-black text-lg cursor-pointer"(click)="selectDrug(data)"
                [ngClass]="{'bg-gray-100': i % 2 === 0, 'bg-white': i % 2 !== 0 }">

                <td class="text-center font-semibold"> {{ i + 1 }} </td>
                <td class="text-black"> {{ data.genericname }} </td>

              </tr>
            </tbody>

          </table>
        </div>
      </div>


    </div>

  </div>
</dialog>
